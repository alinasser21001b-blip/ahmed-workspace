[project]
name = "furniture-intelligence-os"
version = "0.1.0"
description = "The AI Brain of the Furniture Business"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.110.0,<0.116",
  "uvicorn[standard]>=0.27.0",
  "sqlalchemy[asyncio]>=2.0.25",
  "asyncpg>=0.29.0",
  "alembic>=1.13.0",
  "pydantic>=2.6.0,<2.11",
  "pydantic-settings>=2.2.0",
  "redis>=5.0.0",
  "arq>=0.25.0",
  "boto3>=1.34.0",
  "httpx>=0.27.0",
  "python-multipart>=0.0.9",
  "pillow>=10.0.0",
  "pgvector>=0.2.5",
  "email-validator>=2.1.0",
  "orjson>=3.9.0",
  "eval-type-backport>=0.2.0",
  "aiosqlite>=0.20.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.24.0", "ruff>=0.8.0"]

[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
  "model_gateway",
  "furniture_language",
  "design_dna",
  "brain",
  "production",
  "ingest",
  "market",
  "app",
]

[tool.setuptools.package-dir]
model_gateway = "packages/model_gateway/model_gateway"
furniture_language = "packages/furniture_language/furniture_language"
design_dna = "packages/design_dna/design_dna"
brain = "services/brain/brain"
production = "services/production/production"
ingest = "services/ingest/ingest"
market = "services/market/market"
app = "services/api/app"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = [
  "services/api",
  "services/brain",
  "services/production",
  "services/ingest",
  "services/market",
  "packages/model_gateway",
  "packages/furniture_language",
  "packages/design_dna",
]
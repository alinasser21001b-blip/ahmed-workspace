<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Calyptus Furniture — أثاث فاخر. تابعنا واطلب مباشرة عبر واتساب." />
    <meta name="theme-color" content="#ffffff" />
    <title>Calyptus Furniture</title>
    <link rel="canonical" href="https://calyptusfurn.one" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/png" href="assets/logo.png" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="page">
      <!-- ═══ HERO ═══ -->
      <section class="hero">
        <div class="hero__inner">
          <img id="brand-logo" class="hero__logo" src="assets/logo.png" alt="Calyptus Furniture" />

          <h1 id="hero-tagline" class="hero__title">أثاث يعكس ذوقك</h1>
          <p id="hero-description" class="hero__sub"></p>

          <!-- Social — الهدف الرئيسي -->
          <div class="social-hub">
            <p class="social-hub__label">تابعنا وتواصل معنا</p>
            <div id="social-hub-grid" class="social-hub__grid"></div>
          </div>

          <div class="promo">
            <div class="promo__item">
              <span class="promo__key">كود الخصم</span>
              <strong id="promo-code" class="promo__val">CALYPTUS10</strong>
            </div>
            <div class="promo__divider"></div>
            <div class="promo__item">
              <span class="promo__key">المندوب</span>
              <strong id="promo-agent" class="promo__val">فريق Calyptus</strong>
            </div>
          </div>
        </div>

        <div class="hero__visual">
          <img id="hero-image" src="" alt="Calyptus Furniture" />
        </div>
      </section>

      <!-- ═══ PRODUCTS ═══ -->
      <section class="products" id="products">
        <div class="wrap">
          <div class="sec-head">
            <span class="sec-head__tag">مجموعتنا</span>
            <h2>منتجاتنا المميزة</h2>
            <p>اضغط على أي قطعة للطلب عبر واتساب</p>
          </div>
          <div id="category-filters" class="filters"></div>
          <div id="products-grid" class="products__grid"></div>
        </div>
      </section>

      <!-- ═══ WHY US ═══ -->
      <section class="why" id="about">
        <div class="wrap">
          <div id="features-grid" class="why__grid"></div>
        </div>
      </section>

      <!-- ═══ CTA ═══ -->
      <section class="bottom-cta">
        <div class="wrap bottom-cta__box">
          <h2>جاهز تختار أثاثك؟</h2>
          <p>راسلنا على واتساب واحصل على استشارة مجانية</p>
          <a id="cta-whatsapp" class="btn-wa btn-wa--lg" href="#" target="_blank" rel="noopener noreferrer">
            <svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/></svg>
            تواصل عبر واتساب
          </a>
        </div>
      </section>

      <!-- ═══ FOOTER ═══ -->
      <footer class="foot">
        <div class="wrap foot__inner">
          <img src="assets/logo.png" alt="Calyptus" class="foot__logo" />
          <div class="foot__info">
            <span id="contact-phone"></span>
            <span class="foot__dot">·</span>
            <span id="contact-city"></span>
          </div>
          <p class="foot__copy">© <span id="year"></span> Calyptus Furniture · calyptusfurn.one</p>
        </div>
      </footer>
    </div>

    <a id="floating-whatsapp" class="fab" href="#" target="_blank" rel="noopener noreferrer" aria-label="واتساب">
      <svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/></svg>
    </a>

    <script src="js/config.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>

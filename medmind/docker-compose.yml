services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: medmind
      POSTGRES_PASSWORD: medmind
      POSTGRES_DB: medmind
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medmind"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    volumes:
      - .:/app

  worker:
    build: .
    command: arq app.workers.settings.WorkerSettings
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    volumes:
      - .:/app

  student-bot:
    build: .
    command: python -m app.bots.student_bot
    env_file: .env
    depends_on:
      - api
    volumes:
      - .:/app

  admin-bot:
    build: .
    command: python -m app.bots.admin_bot
    env_file: .env
    depends_on:
      - api
    volumes:
      - .:/app

volumes:
  pgdata:
  miniodata:

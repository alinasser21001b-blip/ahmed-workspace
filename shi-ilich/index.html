<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#08070c">
<title>شي إلچ 🌙</title>
<meta property="og:title" content="شي إلچ 🌙">
<meta property="og:description" content="افتحيه وإنتي بمكان هادي.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌙</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;800&family=Aref+Ruqaa:wght@400;700&family=Oswald:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-ember="0">

  <!-- الخلفية: جزيئات / نجوم / أضوية الجمهور -->
  <canvas id="sky"></canvas>

  <!-- توهج الأفق — يدفى كلما تقربت -->
  <div id="horizon"></div>

  <!-- حبيبات فلم سينمائي -->
  <div id="grain"></div>

  <!-- الضوة الصغيرة: نظام التقدّم المخفي -->
  <div id="ember"><i></i></div>

  <!-- زر الصوت -->
  <button id="soundToggle" aria-label="الصوت">🔇</button>

  <!-- المسرح -->
  <main id="stage" aria-live="polite"></main>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>

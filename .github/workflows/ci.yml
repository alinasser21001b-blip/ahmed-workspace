name: student-os CI

# ---------------------------------------------------------------------------
# This file lives at the REPOSITORY root, and that is the whole point of it.
#
# It used to live at `student-os/.github/workflows/ci.yml`. GitHub Actions only
# discovers workflows in `.github/workflows/` at the root of the repository, so
# a workflow nested inside a project directory is never registered and never
# runs. The repository reported zero workflows and every pull request showed
# zero checks — which reads like "nothing to report" and actually meant
# "nothing was ever run". Phases 0 through 5 all merged without CI.
#
# The repository root is a workspace holding several unrelated projects
# (student-os, furniture-os, medmind and a static site). This workflow belongs
# to student-os alone:
#
#   * `paths` keeps it from running when only another project changed.
#   * `defaults.run.working-directory` puts every step inside student-os, so no
#     command can reach a sibling project by accident.
#
# The consequence of the paths filter is worth stating plainly: a pull request
# that touches only furniture-os or medmind will show no checks from this
# workflow, and that is correct rather than a repeat of the old failure. When
# student-os changes, checks appear.
# ---------------------------------------------------------------------------

on:
  push:
    branches: ['**']
    paths:
      - 'student-os/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'student-os/**'
      - '.github/workflows/ci.yml'
  # So the pipeline can be run by hand against any branch, including to confirm
  # it is discoverable at all.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: student-os

jobs:
  # ---------------------------------------------------------------------------
  # Static checks, unit tests, integration tests against a real Postgres, and
  # proof that the migrations build the schema from nothing.
  # ---------------------------------------------------------------------------
  verify:
    name: Typecheck, lint, tests, migrations
    runs-on: ubuntu-latest

    # A disposable Postgres for this job only. It starts empty, it is migrated
    # from empty, and it is destroyed with the runner. Nothing here can reach a
    # developer's database: there is no credential in this repository that
    # points anywhere else, and the test suite refuses any database not named
    # `*_test` on a private host.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: studentos_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      # The ONLY database variable this job sets. `DATABASE_URL` is deliberately
      # absent: the integration suite resolves its own target from
      # TEST_DATABASE_URL and refuses to run if an ambient DATABASE_URL
      # disagrees, so leaving it unset is what exercises the real path.
      # These are throwaway credentials for a container that lives minutes.
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/studentos_test
      JWT_SECRET: ci-only-secret-value-that-is-long-enough-0123456789

    steps:
      - uses: actions/checkout@v4

      # No `version` input on purpose. student-os/package.json declares
      # `packageManager: pnpm@10.33.0`, and the action refuses to run when a
      # version is specified in both places. Reading it from the manifest keeps
      # one source of truth, so bumping pnpm is a single edit that CI follows.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: student-os/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: student-os/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # Shared packages must be built before anything type-checks against them.
      - run: pnpm --filter @sos/contracts --filter @sos/core build

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm test:unit

      - run: pnpm test:integration

      # ---------------------------------------------------------------------
      # Migrations from empty.
      #
      # The integration suite already drops and re-migrates before it runs, so
      # this is a second, explicit proof with an assertion rather than an exit
      # code: every .sql file on disk must have a corresponding applied row.
      # A migration that stops applying cleanly fails the build here instead of
      # failing a deploy.
      # ---------------------------------------------------------------------
      - name: Verify migrations apply from an empty database
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/studentos_test
        run: |
          pnpm db:reset
          on_disk=$(ls apps/api/migrations/*.sql | wc -l)
          applied=$(psql "$DATABASE_URL" -tAc 'SELECT count(*) FROM schema_migrations')
          echo "migrations on disk: $on_disk, applied: $applied"
          if [ "$on_disk" -ne "$applied" ]; then
            echo "::error::migration mismatch — $on_disk file(s) on disk but $applied applied"
            exit 1
          fi
          echo "$applied/$on_disk migrations applied from empty"

      - name: Verify the API builds
        run: pnpm --filter @sos/api build

      # Through `build:web`, not `expo export` directly, so the bundle check also
      # checks the thing that makes a bundle shippable: that it was told where
      # its API lives. A web bundle has no runtime environment, so an unset
      # EXPO_PUBLIC_API_URL used to produce an app addressed to the machine that
      # built it. `build:web` refuses that build; this step proves it still can.
      # The host is a documentation-reserved name — nothing resolves it, and
      # nothing needs to: this step bundles, it does not run.
      - name: Verify the client bundles
        env:
          EXPO_PUBLIC_API_URL: https://api.studentos.example
        run: pnpm --filter @sos/mobile build:web

  # ---------------------------------------------------------------------------
  # The API smoke suite and the browser journeys, against a real server and a
  # real bundle.
  #
  # A separate job because it needs a running server and a browser, and because
  # a red journey should be legible as "the journey broke" rather than buried in
  # a unit-test log. It runs the whole pipeline the Constitution asks for:
  # install → migrate → seed → build → serve → run.
  # ---------------------------------------------------------------------------
  journey:
    name: Smoke suite and browser journeys
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: studentos_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # This job runs the real server against its own disposable database, so
      # DATABASE_URL is set here on purpose — it is not running the integration
      # suite, which is the thing that must never inherit one.
      NODE_ENV: development
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/studentos_e2e
      JWT_SECRET: ci-only-secret-value-that-is-long-enough-0123456789
      PORT: '4000'
      LOG_LEVEL: warn
      # The client is bundled against this, so it must be baked in before the
      # export rather than set at runtime — a web bundle has no environment.
      EXPO_PUBLIC_API_URL: http://localhost:4000
      # Five suites, one runner, one source IP. The production default of 10
      # credential calls per minute is correct for a browser and wrong for a CI
      # job that seeds a cohort and then signs up four throwaway students in the
      # same minute — the limiter would fail the build for working correctly.
      # It is raised only here; the rate limiter itself is still exercised, by
      # the integration suite that asserts it.
      AUTH_RATE_LIMIT_MAX: '200'

    steps:
      - uses: actions/checkout@v4

      # No `version` input on purpose. student-os/package.json declares
      # `packageManager: pnpm@10.33.0`, and the action refuses to run when a
      # version is specified in both places. Reading it from the manifest keeps
      # one source of truth, so bumping pnpm is a single edit that CI follows.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: student-os/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: student-os/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @sos/contracts --filter @sos/core build

      - name: Database — migrate from empty, then seed
        run: |
          pnpm db:reset
          pnpm db:seed

      - name: Build the API and the web bundle
        run: |
          pnpm --filter @sos/api build
          pnpm --filter @sos/mobile build:web

      - name: Start the API
        run: |
          node apps/api/dist/index.js > /tmp/api.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:4000/health/ready > /dev/null; then
              echo "API ready after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "API never became ready"; cat /tmp/api.log; exit 1

      - name: Serve the web bundle
        run: |
          npx --yes serve apps/mobile/dist -l 8081 --single > /tmp/web.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8081 > /dev/null; then
              echo "Bundle served after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "Bundle never served"; cat /tmp/web.log; exit 1

      - name: Install Chromium for Playwright
        run: pnpm exec playwright install --with-deps chromium

      # The API smoke suite runs FIRST and on its own seed. Several of its
      # assertions count rows — messages in a conversation, unread totals — so
      # it has to see the demo dataset before anything else publishes into it.
      - name: Seed the demo cohort
        run: pnpm --filter @sos/api demo:seed

      - name: Smoke-test every product area through the API
        env:
          API_URL: http://localhost:4000
        run: node apps/mobile/e2e/smoke.mjs

      - name: Run the first journey, in Arabic
        env:
          E2E_WEB_URL: http://localhost:8081
          E2E_SHOT_DIR: ${{ runner.temp }}/e2e-shots
          # Let Playwright resolve its own download rather than the image path
          # this repository uses locally.
          PLAYWRIGHT_CHROMIUM: ''
        run: pnpm test:e2e

      # Two browsers, one conversation, a real network interruption. This is the
      # Phase 4 exit criterion, and it is the only test that can observe a
      # message surviving a dropped socket.
      - name: Run the two-user messaging journey
        env:
          E2E_WEB_URL: http://localhost:8081
          E2E_API_URL: http://localhost:4000
          E2E_SHOT_DIR: ${{ runner.temp }}/e2e-shots
          PLAYWRIGHT_CHROMIUM: ''
        run: pnpm test:messaging

      # The Phase 5b vertical slice: open a classroom, publish a lecture, join,
      # read it, reload, and confirm an outsider is refused every surface.
      - name: Run the classroom journey
        env:
          E2E_WEB_URL: http://localhost:8081
          E2E_API_URL: http://localhost:4000
          E2E_SHOT_DIR: ${{ runner.temp }}/e2e-shots
          PLAYWRIGHT_CHROMIUM: ''
        run: pnpm test:classrooms

      - name: Audit RTL and layout — Arabic and English, phone and desktop
        env:
          E2E_WEB_URL: http://localhost:8081
          E2E_API_URL: http://localhost:4000
          E2E_SHOT_DIR: ${{ runner.temp }}/e2e-shots
          PLAYWRIGHT_CHROMIUM: ''
        run: pnpm test:rtl

      # Screenshots are the artefact worth keeping: an RTL layout failure is
      # visible in one and invisible in a log line.
      - name: Upload journey screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journey-screenshots
          path: ${{ runner.temp }}/e2e-shots
          if-no-files-found: ignore

      - name: API log on failure
        if: failure()
        run: cat /tmp/api.log

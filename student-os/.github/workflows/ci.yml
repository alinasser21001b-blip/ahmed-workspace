name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    # Integration tests run against a real Postgres. Mocking the database here
    # would mean the permission tests assert only that the code agrees with
    # itself.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: studentos_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/studentos_test
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/studentos_test
      JWT_SECRET: ci-only-secret-value-that-is-long-enough-0123456789

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Shared packages must be built before anything type-checks against them.
      - run: pnpm --filter @sos/contracts --filter @sos/core build

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm test:unit

      - run: pnpm test:integration

      - name: Verify migrations apply from empty
        run: pnpm db:reset

      - name: Verify the API builds
        run: pnpm --filter @sos/api build

      - name: Verify the client bundles
        run: pnpm --filter @sos/mobile exec expo export --platform web --output-dir dist

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/css text/plain application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # لا تخزّن الصفحة نفسها — التعديلات تظهر فوراً
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # الأنماط والسكربتات: يوم واحد مع إعادة تحقق
    location ~* \.(css|js)$ {
        expires 1d;
        add_header Cache-Control "public, must-revalidate";
    }

    # الصور: بدون immutable — حتى تظهر الصور الجديدة فور استبدالها
    location ~* \.(png|jpg|jpeg|webp|avif|svg|ico)$ {
        expires 1d;
        add_header Cache-Control "public, must-revalidate";
    }
}
